# SPDX-License-Identifier: Apache-2.0
# The A2A boundary-seal example's positive and negative controls, checked
# against the live anchor: daily, on demand, and when the check itself changes.
# GETs only (examples/a2a-ap2/boundary-seal/check_controls.py); it never
# registers anything. A control that changes fails this workflow.
name: A2A controls

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/a2a-ap2/boundary-seal/**"
      - ".github/workflows/a2a-controls.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: check the positive and negative controls
        run: python examples/a2a-ap2/boundary-seal/check_controls.py
