name: Producer interoperability

# Not on pull requests: scripts/check.sh runs this before push (CONTRIBUTING.md).
# On main when an input changes, nightly and on dispatch.
on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "ts/**"
      - "python/**"
      - ".github/workflows/producer-interop.yml"
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs of one ref replace each other; a run on main, a nightly
  # or a dispatch gets its own group and is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AAC_REPO: ${{ github.workspace }}/agent-action-capsule
      CAPSULE_EMIT_TS_ROOT: ${{ github.workspace }}/ts
      CAPSULE_EMIT_GO_ROOT: ${{ github.workspace }}/go
      CLL_GO_ROOT: ${{ github.workspace }}/checkpointed-local-log/go
      CLL_TS_ROOT: ${{ github.workspace }}/checkpointed-local-log/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the AAC corpus matching the Go dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: c508280b393b7b663317744c5d83f467cfb333df
          path: agent-action-capsule
      - name: Check out consolidated CLL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 32ce9f3f901ea85c80a4b42b6fd3ee007fdda2c0 # python/v0.7.0
          path: checkpointed-local-log
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python emit and CLL verifiers
        run: |
          python -m pip install -e ./agent-action-capsule/python
          python -m pip install -e ./python
          python -m pip install -e ./checkpointed-local-log/python
      - name: Generate live Python vectors
        run: python go/testdata/capsule-emit/format4-interop/scripts/generate_vectors.py
      - name: Verify Python vectors with Go
        working-directory: go
        run: scripts/check-format4-interop.sh
      - name: Install TypeScript producer
        working-directory: ts
        run: npm ci
      - name: Verify Python vectors with TypeScript
        working-directory: ts
        run: npm run test:interop
      - name: Build TypeScript producer and CLL
        run: |
          npm --prefix ts run build
          npm --prefix checkpointed-local-log/ts ci
          npm --prefix checkpointed-local-log/ts run build
      - name: Verify both producers with both CLL runners
        working-directory: go
        run: scripts/check-producer-cll-interop.sh

  report-failure:
    # A red run on main or the nightly opens or comments on one ci-red issue
    # (asg-agent-team-ethan#409). A dispatch or a cancelled run is not reported.
    name: report a red main or nightly run
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [interoperability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Producer interoperability failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
