# SPDX-License-Identifier: Apache-2.0
# The capsule-emit crate under rust/: format, lint, tests, the Python-reference
# conformance checks, and the crates.io package check (never a real publish).
#
# Actions are pinned to full commit SHAs (tag in the trailing comment); the
# token is read-only.
name: Rust CI

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml", ".github/scripts/check_crate_metadata.py", "python/**", "test-vectors/artifact-store/**", "go/artifact/*/schema.sql"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml", ".github/scripts/check_crate_metadata.py", "python/**", "test-vectors/artifact-store/**", "go/artifact/*/schema.sql"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: rust

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always
  DEPS_ON_CRATES_IO: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Vendored vectors match their checksums (before any test reads them)
        run: |
          (cd capsule-emit/tests/vectors && shasum -a 256 -c SHA256SUMS)

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (includes the pinned conformance vectors and the byte-parity fixture)
        run: cargo test --locked

      # In the workspace build, capsule-emit-artifact's agent-action-capsule
      # turns on serde_json's arbitrary_precision for every crate. Test
      # capsule-emit as published, without it.
      - name: Tests, capsule-emit alone
        run: cargo test --locked -p capsule-emit

  # The artifact store with every backend, including MySQL against a real
  # MySQL 8.4, through the shared conformance suite.
  artifact-store:
    name: artifact store (all backends, MySQL 8.4)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: capsule_storage_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CAPSULE_STORAGE_TEST_MYSQL: "127.0.0.1:3306"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-artifact-${{ hashFiles('rust/Cargo.lock') }}

      - name: Clippy (all features)
        run: cargo clippy --locked -p capsule-emit-artifact --all-targets --all-features -- -D warnings

      - name: Tests (all features)
        run: cargo test --locked -p capsule-emit-artifact --all-features

  # The Rust output verified by the Python reference implementations.
  conformance:
    name: conformance (Python reference)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-conformance-${{ hashFiles('rust/Cargo.lock') }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Python reference (this repository's package)
        working-directory: python
        run: |
          python -m venv "$RUNNER_TEMP/ref"
          "$RUNNER_TEMP/ref/bin/pip" install .
          echo "AAC_PYTHON=$RUNNER_TEMP/ref/bin/python" >> "$GITHUB_ENV"

      - name: Rust output checked by the reference (fails if a test skipped itself)
        run: |
          scripts="$PWD/capsule-emit/tests/scripts"
          run() { cargo test --locked -p capsule-emit --test "$1" -- --ignored --nocapture 2>&1 | tee -a "$RUNNER_TEMP/conformance.log"; }
          AAC_VERIFY_LEDGER_SCRIPT="$scripts/verify_rust_ledger.py" run chain_ledger_conformance
          AAC_CHECKPOINT_VERIFY_SCRIPT="$scripts/checkpoint_invariance_check.py" run checkpoint_invariance
          AAC_SETTLEMENT_VERIFY_SCRIPT="$scripts/verify_rust_settlement.py" run settlement_conformance
          if grep -i "skipping" "$RUNNER_TEMP/conformance.log"; then
            echo "a conformance test skipped itself" >&2
            exit 1
          fi

  package:
    name: crates.io package check (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # crates.io checks keywords, categories, description, license and
      # repository at upload; `cargo publish --dry-run` does not. Copied
      # verbatim from checkpointed-local-log (d576880).
      - name: Crate metadata meets crates.io's publish rules
        run: python3 ../.github/scripts/check_crate_metadata.py capsule-emit/Cargo.toml capsule-emit-artifact/Cargo.toml

      - name: Package contents
        run: |
          cargo package --list -p capsule-emit
          cargo package --list -p capsule-emit-artifact

      # `cargo publish --dry-run` resolves dependencies from the crates.io
      # index only (a workspace [patch] would not count). The crate's own
      # dependencies (checkpointed-local-log 0.2.1, evidencebook 0.0.1) are
      # published, so the dry run runs; DEPS_ON_CRATES_IO stays as the switch
      # should a dependency ever again be ahead of crates.io.
      - name: Publish dry run, capsule-emit (no upload)
        if: env.DEPS_ON_CRATES_IO == 'true'
        run: cargo publish --dry-run -p capsule-emit
