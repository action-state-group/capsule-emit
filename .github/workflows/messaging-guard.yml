# SPDX-License-Identifier: Apache-2.0
name: messaging-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Consolidation regression tests
        run: python -m unittest discover -s .github/tests -v

      - name: messaging guard self-test
        run: python .github/messaging_guard.py --self-test

      - name: scan public materials for forbidden repositioning phrases
        run: python .github/messaging_guard.py .
