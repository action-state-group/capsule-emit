# SPDX-License-Identifier: Apache-2.0
# Cross-language artifact store interlock (docs/artifact-store.md): for each
# storage format, every language writes the same sequence and every language
# reads and verifies every other language's store. Reports, JSONL bytes, SQL
# rows, StorageChecksums, purge outcomes and error codes must all agree.
# LANGUAGES below is the one list of languages that take part: a language's
# backend joins it, with its adapter and toolchain, in the pull request that
# adds the backend (see .github/scripts/artifact-store-interlock.sh).
# Not on pull requests: scripts/check.sh runs it before push (CONTRIBUTING.md). On
# main when an input changes, nightly and on dispatch.
name: Artifact store interlock

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "ts/**"
      - "python/**"
      - "rust/**"
      - "test-vectors/artifact-store/**"
      - "docs/artifact-store.md"
      - ".github/scripts/artifact-store-interlock.sh"
      - ".github/scripts/artifact_store_rows.py"
      - ".github/workflows/artifact-interlock.yml"
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs of one ref replace each other; a run on main, a nightly
  # or a dispatch gets its own group and is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interlock:
    name: interlock (${{ matrix.format }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [jsonl, sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          # Not UTC, so a backend writing local time instead of
          # UTC_TIMESTAMP(6) falls outside the dump's UTC window.
          TZ: Etc/GMT-5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LANGUAGES: go ts python rust
      CAPSULE_STORAGE_TEST_MYSQL: "127.0.0.1:3306"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "PyMySQL==1.2.3" -e "./python"
          (cd ts && npm ci && npm run build)
      - name: Interlock
        run: .github/scripts/artifact-store-interlock.sh ${{ matrix.format }}
      # The interlock must fail when a report or the stored data is corrupted.
      - name: Negative controls
        run: |
          for inject in report storage read; do
            if INTERLOCK_INJECT=$inject .github/scripts/artifact-store-interlock.sh ${{ matrix.format }} > /dev/null 2>&1; then
              echo "::error::interlock passed with INTERLOCK_INJECT=$inject"
              exit 1
            fi
          done

  report-failure:
    # A red run on main or the nightly opens or comments on one ci-red issue
    # (asg-agent-team-ethan#409). A dispatch or a cancelled run is not reported.
    name: report a red main or nightly run
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [interlock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Artifact store interlock failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
