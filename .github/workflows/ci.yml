name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AAC_REPO: ${{ github.workspace }}/agent-action-capsule
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Python reference main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: main
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with coverage
        run: scripts/check-coverage.sh 90.0

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AAC_REPO: ${{ github.workspace }}/agent-action-capsule
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Python reference main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: main
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        run: go test -race ./...

  interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out capsule-emit-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: capsule-emit-go
      - name: Check out capsule-emit-ts main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ethanyzhang/capsule-emit-ts
          ref: main
          path: capsule-emit-ts
      - name: Check out Python emit main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/capsule-emit
          ref: main
          path: capsule-emit
      - name: Check out Python reference main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: main
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsule-emit-go/go.mod
          cache-dependency-path: capsule-emit-go/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capsule-emit-ts/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python emit main
        run: |
          python -m pip install -e ./agent-action-capsule/python
          python -m pip install -e ./capsule-emit
      - name: Generate live Python interoperability vectors
        run: python capsule-emit-go/testdata/capsule-emit/format4-interop/scripts/generate_vectors.py
      - name: Verify Python vectors with Go
        run: scripts/check-format4-interop.sh
        working-directory: capsule-emit-go
      - name: Install capsule-emit-ts main dependencies
        run: npm ci
        working-directory: capsule-emit-ts
      - name: Verify Python vectors with TypeScript
        run: npm run test:interop
        working-directory: capsule-emit-ts
