# SPDX-License-Identifier: Apache-2.0
name: python

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install capsule-anchor (from source; needed for multi-anchor demo tests; requires Python >=3.11)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-anchor.git"

      - name: install capsule-ledger (from source; not on PyPI, repo archived; the [ledger-io] extra is GONE — this is only so local_payload_store's tests can run)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-ledger.git"

      - name: install capsule-emit
        run: pip install -e ".[dev,agentgateway,langchain,agno,otel]"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: ruff
        working-directory: .
        run: python -m ruff check --config python/pyproject.toml python .github examples commitment-conformance-vectors test-vectors docs skills rust

      - name: pytest
        run: python -m pytest -q

      # The leak-lint tests live next to the lint in .github/, outside testpaths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q ../.github/test_leak_lint.py

  # seal_eval_log drives a real inspect_ai eval; its tests importorskip the
  # package, so they only run where the inspect-ai extra is installed. This
  # job installs it and fails if the import does not work, so those tests
  # cannot silently skip here. (inspect-ai needs Python >= 3.10.)
  inspect-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install capsule-emit with the inspect-ai extra
        run: pip install -e ".[dev,inspect-ai]"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: inspect_ai is importable (so nothing below skips)
        run: python -c "import inspect_ai; print(inspect_ai.__version__)"

      - name: pytest (inspect adapter + reconciliation)
        run: >
          python -m pytest -v -rs
          tests/test_inspect_ai_core.py
          tests/test_inspect_ai_eval_log.py
          tests/test_reconciliation.py

  # agent-action-capsule's registry-conformance check (agent-action-capsule
  # PR #241, not merged or released yet) over one record from each core
  # helper (tests/_library_emissions.py says which). Pinned to one
  # agent-action-capsule commit; move AAC_REF when #241 merges. The pytest step
  # is report-only (continue-on-error) until then; effect.type stays
  # report-only inside the test after that too.
  registry-conformance:
    runs-on: ubuntu-latest
    env:
      AAC_REF: 4c4cd202327d02fce9af08bf968477e6116b4202
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install capsule-emit
        run: pip install -e ".[dev]"

      - name: install agent-action-capsule at AAC_REF
        run: >
          pip install --force-reinstall --no-deps
          "agent-action-capsule @ git+https://github.com/action-state-group/agent-action-capsule.git@${AAC_REF}#subdirectory=python"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: registry_conformance is importable (so nothing below skips)
        run: python -c "import agent_action_capsule.registry_conformance as r; print(r.__file__)"

      - name: pytest (registry conformance; effect.type report-only)
        continue-on-error: true
        run: >
          python -m pytest -v -s
          tests/test_registry_conformance_aac.py
          tests/test_verdict_class_registered.py
