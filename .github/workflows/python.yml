# SPDX-License-Identifier: Apache-2.0
name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install capsule-anchor (from source; needed for multi-anchor demo tests; requires Python >=3.11)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-anchor.git"

      - name: install capsule-ledger (from source; not on PyPI, repo archived; the [ledger-io] extra is GONE — this is only so local_payload_store's tests can run)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-ledger.git"

      - name: install capsule-emit
        run: pip install -e ".[dev,agentgateway,langchain,agno,otel]"

      - name: pin agent-action-capsule to the -05 wire (from source; no PyPI release carries -05 yet)
        # agent-action-capsule main at the -05 wire bump (#126, with its
        # follow-ups): DEFAULT_SPEC_VERSION -05, ACCEPTED_SPEC_VERSIONS (-04,
        # -05). Runs AFTER the install above and forces the reinstall: main
        # still says version 0.5.0, the same as the PyPI release, so a plain
        # install would leave PyPI's -04 build in place. --no-deps keeps the
        # rest of the environment as resolved. tests/test_spec_version_04_05.py
        # checks capsule-emit's constants against it. Replace with a PyPI floor
        # in pyproject.toml once a release carries -05.
        run: >
          pip install --force-reinstall --no-deps
          "git+https://github.com/action-state-group/agent-action-capsule.git@439dc02c05d1177ea7c786bf759994d71b85ccc3#subdirectory=python"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest -q

      # The leak-lint tests live next to the lint in .github/, outside testpaths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q .github/test_leak_lint.py

  # seal_eval_log drives a real inspect_ai eval; its tests importorskip the
  # package, so they only run where the inspect-ai extra is installed. This
  # job installs it and fails if the import does not work, so those tests
  # cannot silently skip here. (inspect-ai needs Python >= 3.10.)
  inspect-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install capsule-emit with the inspect-ai extra
        run: pip install -e ".[dev,inspect-ai]"

      - name: pin agent-action-capsule to the -05 wire (from source; no PyPI release carries -05 yet)
        # agent-action-capsule main at the -05 wire bump (#126, with its
        # follow-ups): DEFAULT_SPEC_VERSION -05, ACCEPTED_SPEC_VERSIONS (-04,
        # -05). Runs AFTER the install above and forces the reinstall: main
        # still says version 0.5.0, the same as the PyPI release, so a plain
        # install would leave PyPI's -04 build in place. --no-deps keeps the
        # rest of the environment as resolved. tests/test_spec_version_04_05.py
        # checks capsule-emit's constants against it. Replace with a PyPI floor
        # in pyproject.toml once a release carries -05.
        run: >
          pip install --force-reinstall --no-deps
          "git+https://github.com/action-state-group/agent-action-capsule.git@439dc02c05d1177ea7c786bf759994d71b85ccc3#subdirectory=python"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: inspect_ai is importable (so nothing below skips)
        run: python -c "import inspect_ai; print(inspect_ai.__version__)"

      - name: pytest (inspect adapter + reconciliation)
        run: >
          python -m pytest -v -rs
          tests/test_inspect_ai_core.py
          tests/test_inspect_ai_eval_log.py
          tests/test_reconciliation.py
