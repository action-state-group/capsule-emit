# SPDX-License-Identifier: Apache-2.0
name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install capsule-anchor (from source; needed for multi-anchor demo tests; requires Python >=3.11)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-anchor.git"

      - name: install capsule-ledger (from source; not on PyPI; needed for the ledger-io extra; requires Python >=3.10)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-ledger.git"

      - name: install capsule-emit
        run: pip install -e ".[dev,agentgateway,langchain,agno,ledger-io]"

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest -q
