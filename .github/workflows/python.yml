# SPDX-License-Identifier: Apache-2.0
name: Python CI

on:
  push:
    branches: [main]
  # Only when the package, a file ruff lints, or an input its tests read
  # changes.
  pull_request:
    paths:
      - "python/**"
      - "**.py"
      - "test-vectors/**"
      - "commitment-conformance-vectors/**"
      - "examples/**"
      - "docs/**"
      - "skills/**"
      - "flows/**"
      - "witnesses.json"
      - "go/testdata/**"
      - "go/artifact/*/schema.sql"
      - ".github/workflows/python.yml"
  # The optional-SDK tests (the extras job) run on main, nightly and on
  # dispatch, not on pull requests.
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs of one ref replace each other; a run on main, a nightly
  # or a dispatch gets its own group and is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-24.04 # 26.04 (ubuntu-latest) has no Python 3.9
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    # The artifact store's MySQL backend runs the shared conformance suite
    # against a real, disposable MySQL 8.4 (tests/test_artifact_store.py).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: capsule_storage_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CAPSULE_STORAGE_TEST_MYSQL: "127.0.0.1:3306"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install capsule-anchor (from source; needed for multi-anchor demo tests; requires Python >=3.11)
        if: matrix.python-version == '3.12'
        run: >
          pip install
          "git+https://github.com/action-state-group/capsule-anchor.git"

      - name: install capsule-emit
        run: pip install -e ".[dev,agentgateway,langchain,agno,otel]"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: ruff
        working-directory: .
        run: python -m ruff check --config python/pyproject.toml python .github examples commitment-conformance-vectors test-vectors docs skills rust

      - name: pytest
        run: python -m pytest -q

      # The leak-lint tests live next to the lint in .github/, outside testpaths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q ../.github/test_leak_lint.py

      - name: release helper tests
        run: python -m pytest -q ../.github/test_release.py

  # seal_eval_log drives a real inspect_ai eval; its tests importorskip the
  # package, so they only run where the inspect-ai extra is installed. This
  # job installs it and fails if the import does not work, so those tests
  # cannot silently skip here. (inspect-ai needs Python >= 3.10.)
  inspect-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install capsule-emit with the inspect-ai extra
        run: pip install -e ".[dev,inspect-ai]"

      - name: agent-action-capsule is the -05 build (so nothing below tests against -04)
        run: >
          python -c "import agent_action_capsule as a;
          assert a.DEFAULT_SPEC_VERSION == 'draft-mih-scitt-agent-action-capsule-05', a.DEFAULT_SPEC_VERSION;
          print(a.__file__, a.DEFAULT_SPEC_VERSION)"

      - name: inspect_ai is importable (so nothing below skips)
        run: python -c "import inspect_ai; print(inspect_ai.__version__)"

      - name: pytest (inspect adapter + reconciliation)
        run: >
          python -m pytest -v -rs
          tests/test_inspect_ai_core.py
          tests/test_inspect_ai_eval_log.py
          tests/test_reconciliation.py

  # The tests that need one optional SDK (an adapter's real framework), one SDK
  # per row, failing if any of them skipped. The test job installs none of
  # these SDKs. The rows are python_extras_tests.sh --list
  # (.github/tests/test_python_extras_matrix.py checks that).
  extras:
    name: extras (${{ matrix.entry }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: [litellm, llamaindex, openai-agents, msft-agent-framework, strands, nemo-guardrails, crewai, langgraph]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: tests with the SDK installed
        run: bash ../.github/scripts/python_extras_tests.sh "${{ matrix.entry }}" python

  report-failure:
    # A red run on main or the nightly opens or comments on one ci-red issue
    # (asg-agent-team-ethan#409). A dispatch or a cancelled run is not reported.
    name: report a red main or nightly run
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [test, inspect-ai, extras]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report on the issue
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Python CI failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
