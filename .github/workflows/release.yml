# SPDX-License-Identifier: Apache-2.0
# Keep this filename: it is part of the existing PyPI Trusted Publisher identity.
name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'python/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python release identity and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/check_python_release.py "$RELEASE_TAG" pyproject.toml
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
