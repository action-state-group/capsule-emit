[package]
name = "capsule-emit-evidence-request"
version = "0.0.5"
edition = "2021"
license = "Apache-2.0"
description = "Deprecated: renamed to evidence-request. Re-exports evidence-request, the evidence request protocol (draft-mih-agent-evidence-request-00)."
repository = "https://github.com/action-state-group/capsule-emit"
readme = "README.md"
keywords = ["scitt", "evidence", "transparency", "protocol", "agents"]
categories = ["cryptography", "encoding"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[lib]
name = "capsule_emit_evidence_request"
path = "src/lib.rs"

[dependencies]
# The protocol now lives in evidence-request (agent-action-capsule); this
# crate only re-exports it. Default features, so the answer path and witness
# receipts are there as in 0.0.4.
evidence-request = "0.1"
