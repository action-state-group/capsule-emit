[package]
name = "capsule-emit-artifact"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Artifact store for Agent Action Capsules: exact sealed Capsules, Producer Envelopes and originals with retention and purge, on JSONL, memory, SQLite or MySQL."
repository = "https://github.com/action-state-group/capsule-emit"
readme = "README.md"
keywords = ["scitt", "agent-action-capsule", "evidence", "storage"]
categories = ["cryptography", "database"]
include = ["/src/**/*.rs", "/src/conformance_vectors.json", "/src/*.sql", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]
# Not released yet: publishing needs an entry in .github/releases.json and the
# crates.io trusted publisher, which come with a release decision.
publish = false

[lib]
name = "capsule_emit_artifact"
path = "src/lib.rs"

[features]
default = []
# The SQLite backend (rusqlite with a bundled SQLite).
sqlite = ["dep:rusqlite"]
# The MySQL 8.4 backend (the pure-Rust `mysql` client, no TLS by default:
# enable one of the `mysql` crate's TLS features in your own manifest).
mysql = ["dep:mysql"]

[dependencies]
agent-action-capsule = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
mysql = { version = "28", optional = true, default-features = false, features = ["minimal-rust"] }

[dev-dependencies]
tempfile = "3"

# The cross-language interlock adapter (.github/scripts/artifact-store-interlock.sh).
[[example]]
name = "interlock"
required-features = ["sqlite", "mysql"]
