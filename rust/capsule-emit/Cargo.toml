[package]
name = "capsule-emit"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Seal, sign, chain and checkpoint Agent Action Capsule records: JCS capsule ids, COSE_Sign1 signed statements, a durable local ledger, and signed log checkpoints."
repository = "https://github.com/action-state-group/capsule-emit"
readme = "README.md"
keywords = ["scitt", "cose", "transparency", "evidence", "agents"]
categories = ["cryptography"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
name = "capsule_emit"
path = "src/lib.rs"

[[bin]]
name = "verify_capsule"
path = "src/bin/verify_capsule.rs"

[dependencies]
# The checkpoint substrate, canonicalization and padding records come from
# `evidencebook`; `cll` is the log it embeds.
evidencebook = "0.0.1"
cll = { package = "checkpointed-local-log", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
coset = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
pkcs8 = { version = "0.10", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
