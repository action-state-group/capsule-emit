# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-emit"
version = "0.8.6"
description = "One-call emit() for Agent Action Capsules — checkpoint/witness on by default, ledger view CLI, thin framework adapters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["scitt", "agent", "capsule", "verification", "transparency", "audit"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Development Status :: 3 - Alpha",
]
# checkpointed-local-log's `cll` package -- the CLL/MMR core, graduated out
# of this repo per the W3.1 extraction (2026-09-01; was capsule_emit.checkpoint,
# itself ported from capsule-ledger's mmr/{core,index,store}.py per Amendment
# E, 2026-08-21). capsule_emit.checkpoint / capsule_emit.bundle are now thin
# compatibility re-exports over it -- see those modules' docstrings. Pulls in
# scitt-cose + cbor2 + agent-action-capsule transitively. A CORE dependency,
# not an extra: capsule_emit/checkpoint/*.py import `cll.checkpoint.*`
# unconditionally at module scope, and witnessing (which reaches that import
# lazily but from inside a plain `capsule-emit` install) is ON BY DEFAULT --
# so every install needs cll available, not just installs that opt into a
# `checkpoint` extra.
# Floor bumped to 0.2.0 ([mesh-ledger-store-migration]): capsule_emit.ledger's
# read_ledger/read_ledger_entries now detect a cll.ledger.store.LedgerStore
# directory (manifest.json present) and read it via cll.ledger.store /
# cll.ledger.segments directly -- segment rotation/archival (list_segments,
# mount_segment/unmount_segment, SegmentManifest) shipped in 0.2.0.
dependencies = [
    "agent-action-capsule[anchor,envelope]>=0.3.0",
    "cryptography>=42.0",
    "checkpointed-local-log>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4,<0.16", "grpcio>=1.60", "protobuf>=5.0"]
langchain = ["langchain-core>=0.1"]
crewai = ["crewai>=0.40"]
mcp = ["mcp>=1.0"]
agentgateway = ["grpcio>=1.60", "protobuf>=5.0"]
hermes = []
adk = ["google-adk>=2.0"]
agno = ["agno>=3.0"]
# Pinned to the release the hook contract was read and tested against
# (BeforeToolCallEvent/AfterToolCallEvent, strands/hooks/events.py:208/:248).
strands = ["strands-agents>=1.54.0,<2"]
# Verified against openai-agents 0.22.0 (see docs/adapters/openai-agents.md).
openai-agents = ["openai-agents>=0.22"]
llamaindex = ["llama-index-core>=0.14,<0.15", "llama-index-workflows>=2.14,<2.24"]  # 2.24.0 (2026-09-16) keys a WeakKeyDictionary by the Workflow instance; FunctionAgent is unhashable -> TypeError on run()
# Pinned to the release the rail-decision contract was read and tested against
# (RailOutcome/RailDecision, actions/rail_outcome.py:50-92; LLMRails.register_action,
# llmrails.py:1735). Upper bound is tight on purpose: nemoguardrails is 0.x, so a
# minor bump may change that contract. The environment marker is required because
# nemoguardrails declares Requires-Python ">=3.10,<3.14" while capsule-emit supports
# >=3.9 — without it, `pip install capsule-emit[nemo-guardrails]` hard-fails on 3.9.
nemo-guardrails = ["nemoguardrails>=0.24.0,<0.25; python_version >= '3.10'"]
# NO `ledger-io` extra. It used to declare `capsule-ledger>=0.0.1`, which is
# NOT on PyPI and never will be -- that repo was archived 2026-09-02 and stays
# archived -- so `pip install capsule-emit[ledger-io]` failed for every
# consumer of every published wheel, while CI stayed green because the
# workflow installs capsule-ledger from git. A published package cannot point
# an extra at a git URL, so the extra had to go rather than be repaired.
# Only ledger_io.local_payload_store() ever needed it (PayloadStore has no
# checkpointed-local-log equivalent); it now raises with the from-source
# install line instead of failing obscurely. Every other ledger_io function
# uses LedgerStore/ScanQuery from `cll.ledger`, a hard dependency above.
dapr-agents = ["dapr-agents>=1.0"]
# Microsoft Agent Framework. The middleware surface this adapter rides lives entirely in
# agent-framework-core; the `agent-framework` meta-package pulls provider/Azure extras we
# do not need. `agent-framework` is a spelling alias for the same requirement.
msft-agent-framework = ["agent-framework-core>=1.16.0,<2"]
agent-framework = ["agent-framework-core>=1.16.0,<2"]
litellm = ["litellm>=1.99.0"]
checkpoint = ["scitt-cose>=0.2.0"]

[project.scripts]
capsule-emit = "capsule_emit.cli:main"
capsule-emit-server = "capsule_emit.server:main"
capsule-emit-agentgateway = "capsule_emit.adapters.agentgateway:main"

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-emit"
Source = "https://github.com/action-state-group/capsule-emit"
Tracker = "https://github.com/action-state-group/capsule-emit/issues"
Specification = "https://github.com/action-state-group/agent-action-capsule"
Organization = "https://github.com/action-state-group"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_emit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mcp: tests that require the mcp package (FastMCP integration)",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
